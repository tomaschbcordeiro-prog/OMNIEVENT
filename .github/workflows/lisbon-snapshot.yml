name: Lisbon agenda snapshot

# The Agenda Cultural de Lisboa API refuses requests from Vercel's network, so a
# snapshot is committed here and used whenever the live API can't be reached.
# GitHub's runners are refused too (HTTP 403), so this runs on demand only. Add back
#   schedule: [{ cron: "23 5 * * *" }]
# once the City of Lisbon allows automated access from cloud networks.
on:
  workflow_dispatch:

# Only what the job needs: to commit the snapshot. Actions are pinned to exact commits, so a
# moved tag can't swap in someone else's code.
permissions:
  contents: write

concurrency:
  group: lisbon-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/fetch-lisbon.mjs
      - name: Commit if changed
        run: |
          git config user.name "mundivi-bot"
          git config user.email "mundivi-bot@users.noreply.github.com"
          git add src/lib/providers/data/lisbon-events.json
          git diff --cached --quiet || (git commit -m "Update Lisbon agenda snapshot" && git push)
